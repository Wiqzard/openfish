[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openfish"
version = "0.1.0"
description = "OpenFish - Personal Ai Poker Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "jinja2>=3.1,<4.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[project.scripts]
openfish-dummy-vlm = "app.testing.dummy_vlm_server:main"
openfish-dummy-vlm-client = "app.testing.dummy_vlm_client:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
include = [
  "app/**/*.py",
  "app/static/**",
  "app/templates/**",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
