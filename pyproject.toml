[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openfish"
version = "0.1.0"
description = "OpenFish - Personal Ai Poker Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "jinja2>=3.1,<4.0",
  "mcp[cli]>=1.26.0,<2.0",
  "pydantic>=2.9,<3.0",
  "rich>=14.3.3",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
openfish = "app.cli:main"
openfish-dummy-vlm = "app.testing.dummy_vlm_server:main"
openfish-dummy-vlm-client = "app.testing.dummy_vlm_client:main"
openfish-mcp = "app.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["TexasSolver"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests"]
exclude = ["TexasSolver", ".venv", ".openfish", "coverage", "dist", "node_modules"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true

[tool.hatch.build]
include = [
  "app/**/*.py",
  "app/static/**",
  "app/templates/**",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "anyio>=4.12.1",
    "coverage>=7.13.4",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=8.4.2",
    "ruff>=0.15.6",
]
